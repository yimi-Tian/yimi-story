name: WB2 PostgreSQL Integration

on:
  workflow_dispatch:
  push:
    branches:
      - backend/walking-identity-foundation
    paths:
      - .github/workflows/wb2-postgres-integration.yml
      - supabase/migrations/202610050001_activity_walking_identities.sql
      - tests/supabase/walking-identity-bootstrap.sql
      - tests/supabase/walking-identity.integration.test.mjs
      - tools/walking/legacy-identity-import.mjs

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yimi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d yimi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      YIMI_WALKING_DATABASE_URL: postgresql://test:test@localhost:5432/yimi_test
      YIMI_RUN_WALKING_IDENTITY_INTEGRATION: "1"
      YIMI_REQUIRE_WALKING_IDENTITY_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify PostgreSQL client
        run: |
          psql --version
          psql "$YIMI_WALKING_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "show server_version;"

      - name: Create CI prerequisite schema
        run: psql "$YIMI_WALKING_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/supabase/walking-identity-bootstrap.sql

      - name: Apply real WB2 migration
        run: |
          psql "$YIMI_WALKING_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/202610050001_activity_walking_identities.sql
          echo "migration applied"

      - name: Run non-skipped PostgreSQL integration
        run: node --test tests/supabase/walking-identity.integration.test.mjs
